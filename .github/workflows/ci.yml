name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit and property tests (TDD)
        run: pytest -q

      - name: Eval gate (EDD)
        run: python evals/run_input_eval.py --no-log

      - name: Prompt builder eval gate (EDD level 1)
        run: python evals/run_prompt_eval.py

      - name: Random eval across seeds
        run: |
          for seed in 1 2 3 4 5; do
            python evals/generate_random_cases.py --seed "$seed" --count 300 --out "$RUNNER_TEMP/random-$seed.jsonl"
            python evals/run_input_eval.py --no-log "$RUNNER_TEMP/random-$seed.jsonl"
          done
